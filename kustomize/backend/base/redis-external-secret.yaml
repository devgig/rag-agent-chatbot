# Pulls the Redis password from Azure Key Vault and projects it as a local
# Secret named "redis-credentials" with the keys (host, port, password) the
# backend container expects. Mirrors the convention used by auth-service.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-external-secret
  annotations:
    "external-secrets.io/delete-on-resource-deletion": "true"
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: azure-keyvault-secret-store
    kind: ClusterSecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        host: redis-master.redis-system.svc.cluster.local
        port: "6379"
  data:
    - secretKey: password
      remoteRef:
        key: redis-system-password-dev
