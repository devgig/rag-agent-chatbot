apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: rag-agent-backend

resources:
  - deployment.yaml
  - service.yaml
  - postgres-external-secret.yaml
  - redis-external-secret.yaml
  - acr-external-secret.yaml
  - destinationrule.yaml
  - httproute.yaml
  # KEDA autoscaling
  - keda-scaledobject.yaml
  # ExternalName alias so backend resolves nemotron-nano-8b:8000 → nemotron.kserve.svc
  - nemotron-kserve-externalname-service.yaml

patches:
  - target:
      kind: Deployment
      name: rag-agent-backend
    path: image-patch.yaml

labels:
- includeSelectors: false
  pairs:
    component: backend
