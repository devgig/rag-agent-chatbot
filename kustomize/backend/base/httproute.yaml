apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rag-agent-backend-httproute
spec:
  hostnames:
    - sparkchat.bytecourier.local
    - sparkchat.bytecourier.com
  parentRefs:
    - name: rag-agent-gateway
      namespace: istio-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/backend-svc
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      # SSE streams can run for the duration of an LLM response. Default
      # Envoy route timeout is 15s, which is too short — set request and
      # backend timeouts wide enough for long generations.
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: rag-agent-backend
          port: 8000
