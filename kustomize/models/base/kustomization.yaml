# Model Serving Configuration
# ==================================================================================================
# As of the KServe migration, application-side LLM serving is owned by KServe
# (InferenceService at nemotron.kserve.svc.cluster.local:8000, served model:
# nemotron-nano-8b — backed by nvidia/Llama-3.1-Nemotron-Nano-8B-v1 via vLLM).
# KServe + its InferenceService live in the kserve namespace and are managed
# outside this repo.
#
# What remains in this kustomization:
# - The "llm" namespace, kept available for future model workloads that don't fit
#   under KServe (deletion is a separate, manual cleanup if/when desired).
# - ACR pull credentials in that namespace.
#
# Client-side routing (ExternalName alias so the backend can reach KServe via the
# short service name) lives in kustomize/backend/base/.
#
# AZURE DEVOPS:
# Deploy via: kubectl apply -k kustomize/models/overlays/dev/
# Pipeline: azure-pipelines-models.yaml (triggers on kustomize/models/** changes)
# ==================================================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: llm-namespace

resources:
  - llm-namespace.yaml                # Shared "llm" namespace (kept for future workloads)
  - acr-external-secret.yaml          # ACR pull credentials from Azure Key Vault
